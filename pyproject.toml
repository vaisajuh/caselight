[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caselight"
version = "0.1.0"
description = "Motherboard and case RGB lighting control for Linux (currently ASUS Aura)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
caselight = "caselight.cli:main"

[tool.setuptools]
packages = ["caselight"]

[tool.setuptools.package-data]
caselight = ["web/*.html"]
